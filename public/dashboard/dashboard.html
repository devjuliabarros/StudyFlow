<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyFlow - Painel</title>
    <link rel="stylesheet" href="/css/dashboard.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="shortcut icon" href="../assets/icon/favicon.svg" type="image/x-icon">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<section>
    <div class="dashboard">
        <header>
            <div class="topo">
                <div class="logo">
                    <img src="../assets/icon/studyflow.svg" alt="Logo">
                    <h2>StudyFlow</h2>
                </div>

                <div class="user">
                    <p id="nomeUsuario">Olá, Usuario</p>
                </div>
            </div>

            <div class="nav">
                <ul>
                    <li><a href="perfil.html">Perfil</a></li>
                    <li class="agora"><a href="dashboard2.html">Painel</a></li>
                </ul>
            </div>

            <a href="../login.html">Sair</a>
        </header> 
        
        <div class="dashboard-container">
                <div class="left">
                    <div class="title">
                        <h3>Meu Painel de Tarefas</h3>
                    </div>
                    <div class="cards">
                    <div class="card">
                        <h4>Tarefas Pendentes</h4>
                        <p id="pendentesQtd">0</p>
                    </div>

                    <div class="card">
                        <h4>Tarefas em Andamento</h4>
                        <p id="andamentoQtd">0</p>
                    </div>

                    <div class="card">
                        <h4>Tarefas Concluídas</h4>
                        <p id="concluidasQtd">0</p>
                    </div>
                    </div>

                    <div class="middle">
                    <div class="to-do">
                        <h4>Tarefas do Dia</h4>
                        <div id="tarefasHoje"></div>
                    </div>

                    <div class="task-list">
                    <div class="top">
                        <h4>Minhas Tarefas</h4>
                            <button onclick="abrirModal()"> Adicionar
                        </button>
                    </div>

                        <div id="todasTarefas"></div>
                    </div>
                    </div>
                </div>

                <div class="right">
                    <div class="graphics">
                        <div class="graphic">
                            <div class="graphic-header">
                                <button onclick="navegarSemana(-1)">&#8592;</button>
                                <h3 id="tituloSemana">Semana Atual</h3>
                                <button onclick="navegarSemana(1)" id="btnProximaSemana" disabled>&#8594;</button>
                            </div>
                            <canvas id="graficoSemana"></canvas>
                        </div>

                        <div class="graphic">
                            <h3>Tarefas Concluídas por Mês em 2026</h3>
                            <canvas id="graficoMes"></canvas>
                        </div>
                    </div>
                </div>
        </div>
    </div>
</section>

    <!-- Modal de Criar uma Nova Tarefa -->
    <div id="modalTarefa" class="modal">
        <div class="modal-content">
            <h3 id="tituloModal">Nova Tarefa</h3>

            <input type="text" id="inputNome" placeholder="Nome">
            <input type="text" id="inputDisciplina" placeholder="Disciplina">
            <div class="prioridade">
                <p>Defina a prioridade:</p>
                <select id="inputPrioridade">
                    <option value="alta">🔴 Alta</option>
                    <option value="media" selected>🟡 Média</option>
                    <option value="baixa">🟢 Baixa</option>
                </select>
            </div>
            <input type="date" id="inputData">

            <div class="buttons">
            <button onclick="salvarTarefa()">Salvar</button>
            <button onclick="fecharModal()">Cancelar</button>
            </div>
        </div>
    </div>

</body>
</html>

<script>

    window.onload = inicializar;

    function inicializar() {
        carregarUsuario();
        carregarTarefas();
        carregarCards();
        obterDadosGraficoSemana();
        obterDadosGraficoMes();
    }

    // Função responsável por carregar o nome do usuário na tela
    function carregarUsuario() {
        let nome = sessionStorage.getItem("NOME_USUARIO");

        if (nome) {
            document.getElementById("nomeUsuario").innerHTML = 
                `Olá, <br> <strong>${nome}</strong>`;
        }
    }

    // Função responsável por buscar e exibir as tarefas do usuário
     function carregarTarefas() {
        let fkUsuario = sessionStorage.getItem("ID_USUARIO");

        fetch("/tarefas/listar/" + fkUsuario, { cache: 'no-store' })
            .then(function(response) {
                if (response.ok) {
                    response.json().then(function(tarefas) {
                        console.log("Tarefas recebidas: " + JSON.stringify(tarefas));

                        let hoje = new Date().toISOString().split("T")[0];

                        let divHoje = document.getElementById("tarefasHoje");

                        let divTodas = document.getElementById("todasTarefas");

                        divHoje.innerHTML = "";
                        divTodas.innerHTML = "";

                        for (let i = 0; i < tarefas.length; i++) {
                            let tarefa = tarefas[i];
                            let dataFormatada = "Sem data";
                            let status = (tarefa.status || "").trim().toLowerCase();
                            let acao = "";

                            if (tarefa.data) {
                                dataFormatada = tarefa.data.split("T")[0];
                            }

                            if (status == "pendente") {
                                acao = '<i class="bi bi-play-fill"></i>';
                            } else if (status == "andamento") {
                                acao = '<i class="bi bi-check-lg"></i>';
                            }

                            let atrasada = false;

                            if (tarefa.data && status !== "concluido") {
                                let dataTarefa = new Date(tarefa.data);
                                let hojeDate = new Date();
                                dataTarefa.setHours(0, 0, 0, 0);
                                hojeDate.setHours(0, 0, 0, 0);
                                if (dataTarefa < hojeDate) {
                                    atrasada = true;
                                }
                            }

                            let avisoPrazo = "";

                            if (atrasada) {
                                avisoPrazo = '<span class="prazo">Atrasada</span>';
                            }

                            let cores = { alta: "🔴", media: "🟡", baixa: "🟢" };
                            let corPrioridade = cores[tarefa.prioridade] || "🟡";

                            let tarefaHTML = '<div class="tarefa ' + tarefa.status + '">' +
                                '<p>' + corPrioridade + '</p>' +
                                '<p>' + tarefa.nome + '</p>' +
                                '<p>' + tarefa.disciplina + '</p>' +
                                '<p>' + dataFormatada + '</p>' +
                                avisoPrazo +
                                '<div class="acoes">' +
                                    '<button onclick="toggleStatus(' + tarefa.idTarefa + ', \'' + tarefa.status + '\')">' + acao + '</button>' +
                                    '<button onclick="editarTarefa(' + tarefa.idTarefa + ', \'' + tarefa.nome + '\', \'' + tarefa.disciplina + '\', \'' + dataFormatada + '\', \'' + tarefa.prioridade + '\')">' +
                                        '<i class="bi bi-pencil-square"></i>' +
                                    '</button>' +
                                    '<button onclick="deletarTarefa(' + tarefa.idTarefa + ')"><i class="bi bi-trash2-fill"></i></button>' +
                                '</div>' +
                            '</div>';

                            divTodas.innerHTML += tarefaHTML;
                            if (dataFormatada == hoje) {
                                divHoje.innerHTML += tarefaHTML;
                            }
                        }
                    });
                } else {
                    console.error('Nenhum dado encontrado ou erro na API');
                }
            })
            .catch(function(error) {
                console.error("Erro ao carregar tarefas: " + error.message);
            });
    }

    // Função responsável por alternar (trocar) o status de uma tarefa
    function toggleStatus(id, statusAtual) {
        let novoStatus = "";

        if (statusAtual == "pendente") {
            novoStatus = "andamento";
        } else if (statusAtual == "andamento") {
            novoStatus = "concluido";
        };

        fetch("/tarefas/status", {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ idTarefa: id, status: novoStatus })
        })
        .then(function(response) {
            if (response.ok) {
                console.log("Status atualizado com sucesso");
                setTimeout(function() {
                    carregarTarefas();
                    carregarCards();
                    obterDadosGraficoSemana();
                    obterDadosGraficoMes();
                }, 100);
            } else {
                console.error('Erro ao atualizar status');
            }
        })
        .catch(function(error) {
            console.error("Erro ao atualizar status: " + error.message);
        });
    } 

    // Função responsável por abrir o modal de criação de tarefa
    function abrirModal() {

        // Define que nenhuma tarefa está sendo editada
        idTarefaEditando = null;

        //Limpa os campos
        document.getElementById("inputNome").value = "";
        document.getElementById("inputDisciplina").value = "";
        
        // Define o Título do Modal
        document.getElementById("tituloModal").innerHTML = "Nova Tarefa";

        // Seleciona o elemento do modal pelo ID
        // e altera o display para "flex", tornando-o visível na tela
        document.getElementById("modalTarefa").style.display = "flex";
        
        // Obtém a data atual no formato ISO (YYYY-MM-DDTHH:mm:ss)
        // e separa apenas a parte da data (antes do "T")
        let hoje = new Date().toISOString().split("T")[0];

        // Define a data atual como valor padrão no input de data
        document.getElementById("inputData").value = hoje;
    }

    // Função responsável por fechar o modal de tarefa
    function fecharModal() {
        document.getElementById("modalTarefa").style.display = "none";
    }
    
    // Função responsável por coletar os dados do formulário e enviar uma nova tarefa para o backend
    function salvarTarefa() {
        let nome = document.getElementById("inputNome").value;
        let disciplina = document.getElementById("inputDisciplina").value;
        let prioridade = document.getElementById("inputPrioridade").value;
        let data = document.getElementById("inputData").value;
        let fkUsuario = sessionStorage.getItem("ID_USUARIO");

        if (!nome || !data) {
            alert("Preencha os campos!");
            return;
        }

        let url = "/tarefas/cadastrar";
        let metodo = "POST";

        if (idTarefaEditando != null) {
            url = "/tarefas/editar/" + idTarefaEditando;
            metodo = "PUT";
        }

        fetch(url, {
            method: metodo,
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ nome: nome, disciplina: disciplina, prioridade: prioridade, data: data, fkUsuario: fkUsuario })
        })
        .then(function(response) {
            if (response.ok) {
                console.log("Tarefa salva com sucesso");
                fecharModal();
                carregarTarefas();
                carregarCards();
            } else {
                console.error('Erro ao salvar tarefa');
            }
        })
        .catch(function(error) {
            console.error("Erro ao salvar tarefa: " + error.message);
        });
    }

    // Armazena o ID da tarefa que está sendo editada no momento.
    // Inicialmente começa como null porque nenhuma tarefa foi selecionada.
    let idTarefaEditando = null;

    // Função responsável por editar uma tarefa
    function editarTarefa(id, nome, disciplina, data, prioridade) {
        // Armazena o ID da tarefa que será editada
        idTarefaEditando = id;

        // Define o Título do Modal
        document.getElementById("tituloModal").innerHTML = "Editar Tarefa";

        document.getElementById("inputNome").value = nome;
        document.getElementById("inputDisciplina").value = disciplina;
        document.getElementById("inputPrioridade").value = prioridade;
        document.getElementById("inputData").value = data;

        document.getElementById("modalTarefa").style.display = "flex";
    }
    
    // Função responsável por deletar uma tarefa
    function deletarTarefa(id) {
        fetch("/tarefas/deletar", {
            method: "DELETE",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ idTarefa: id })
        })
        .then(function(response) {
            if (response.ok) {
                console.log("Tarefa deletada com sucesso");
                carregarTarefas();
                carregarCards();
                obterDadosGraficoSemana();
                obterDadosGraficoMes();
            } else {
                console.error('Erro ao deletar tarefa');
            }
        })
        .catch(function(error) {
            console.error("Erro ao deletar tarefa: " + error.message);
        });
    }

    // Função responsável por buscar e atualizar os cards
    function carregarCards() {
        let fkUsuario = sessionStorage.getItem("ID_USUARIO");

        fetch("/tarefas/contagem/" + fkUsuario, { cache: 'no-store' })
            .then(function(response) {
                if (response.ok) {
                    response.json().then(function(dados) {
                        console.log("Contagem recebida: " + JSON.stringify(dados));

                        let pendente = 0;
                        let andamento = 0;
                        let concluido = 0;

                        for (let i = 0; i < dados.length; i++) {
                            let status = (dados[i].status || "").toLowerCase();
                            if (status == "pendente") pendente = dados[i].total;
                            if (status == "andamento") andamento = dados[i].total;
                            if (status == "concluido") concluido = dados[i].total;
                        }

                        document.getElementById("pendentesQtd").innerHTML = pendente;
                        document.getElementById("andamentoQtd").innerHTML = andamento;
                        document.getElementById("concluidasQtd").innerHTML = concluido;
                    });
                } else {
                    console.error('Erro ao buscar contagem');
                    document.getElementById("pendentesQtd").innerHTML = 0;
                    document.getElementById("andamentoQtd").innerHTML = 0;
                    document.getElementById("concluidasQtd").innerHTML = 0;
                }
            })
            .catch(function(error) {
                console.error("Erro ao carregar cards: " + error.message);
                document.getElementById("pendentesQtd").innerHTML = 0;
                document.getElementById("andamentoQtd").innerHTML = 0;
                document.getElementById("concluidasQtd").innerHTML = 0;
            });
    }

    // Função de Navegação entre as semanas no Gráfico Semanal
    // 0 = semana atual
    let deslocamentoSemana = 0; 
    
    function navegarSemana(direcao) {
        deslocamentoSemana += direcao;
        obterDadosGraficoSemana();
    }
    
    // Gráfico Semanal
    let proximaAtualizacaoSemana;

    function obterDadosGraficoSemana() {
        let fkUsuario = sessionStorage.getItem("ID_USUARIO");

        let hoje = new Date();
        
        let inicioDaSemana = new Date(hoje.getFullYear(), hoje.getMonth(), hoje.getDate() - hoje.getDay() + (deslocamentoSemana * 7));
        let fimDaSemana = new Date(inicioDaSemana.getFullYear(), inicioDaSemana.getMonth(), inicioDaSemana.getDate() + 6);

        function formatarData(data) {
            let dia = String(data.getDate()).padStart(2, "0");
            let mes = String(data.getMonth() + 1).padStart(2, "0");
            return dia + "/" + mes;
        }

        document.getElementById("btnProximaSemana").disabled = deslocamentoSemana >= 0;

        if (deslocamentoSemana == 0) {
            document.getElementById("tituloSemana").innerHTML = `Semana Atual (${formatarData(inicioDaSemana)} - ${formatarData(fimDaSemana)})`;
        } else {
            document.getElementById("tituloSemana").innerHTML = `${formatarData(inicioDaSemana)} - ${formatarData(fimDaSemana)}`;
        }

        if (proximaAtualizacaoSemana != undefined) {
            clearTimeout(proximaAtualizacaoSemana);
        }

        fetch(`/tarefas/semana/${fkUsuario}/${deslocamentoSemana}`, { cache: 'no-store' }).then(function(response) {
            if (response.ok) {
                response.json().then(function(resposta) {
                    console.log(`Dados recebidos: ${JSON.stringify(resposta)}`);
                    plotarGraficoSemana(resposta);
                });
            } else {
                console.error('Nenhum dado encontrado ou erro na API');
            }
        })
        .catch(function(error) {
            console.error(`Erro na obtenção dos dados p/ gráfico semanal: ${error.message}`);
        });
    }

    function plotarGraficoSemana(resposta) {
        console.log('iniciando plotagem do gráfico semanal...');

        let nomesDias = ["Dom", "Seg", "Ter", "Qua", "Qui", "Sex", "Sáb"];
        let valores = { "Dom": 0, "Seg": 0, "Ter": 0, "Qua": 0, "Qui": 0, "Sex": 0, "Sáb": 0 };

        for (let i = 0; i < resposta.length; i++) {
            valores[resposta[i].diaSemana] = resposta[i].total;
        }

        let dadosOrdenados = [];

        for (let i = 0; i < nomesDias.length; i++) {
            dadosOrdenados.push(valores[nomesDias[i]]);
        }

        let dados = {
            labels: nomesDias,
            datasets: [{
                label: "Tarefas Concluídas na Semana",
                data: dadosOrdenados,
                backgroundColor: "#DDD1FE"
            }]
        };

        let config = { type: "bar", data: dados };

        if (window.graficoSemana && window.graficoSemana.destroy) {
            window.graficoSemana.destroy();
        }

        window.graficoSemana = new Chart(document.getElementById("graficoSemana"), config);

        setTimeout(() => atualizarGraficoSemana(dados, window.graficoSemana), 2000);
    }

    function atualizarGraficoSemana(dados, myChart) {
        let fkUsuario = sessionStorage.getItem("ID_USUARIO");

        fetch(`/tarefas/semana/${fkUsuario}/${deslocamentoSemana}`, { cache: 'no-store' }).then(function(response) {
            if (response.ok) {
                response.json().then(function(novosDados) {
                    console.log(`Dados atualizados semana: ${JSON.stringify(novosDados)}`);

                    if (myChart !== window.graficoSemana) {
                        console.log("Gráfico substituído, cancelando atualização.");
                        return;
                    }

                    let nomesDias = ["Dom", "Seg", "Ter", "Qua", "Qui", "Sex", "Sáb"];

                    let valores = { "Dom": 0, "Seg": 0, "Ter": 0, "Qua": 0, "Qui": 0, "Sex": 0, "Sáb": 0 };

                    for (let i = 0; i < novosDados.length; i++) {
                        valores[novosDados[i].diaSemana] = novosDados[i].total;
                    }

                    let dadosOrdenados = [];

                    for (let i = 0; i < nomesDias.length; i++) {
                        dadosOrdenados.push(valores[nomesDias[i]]);
                    }

                    dados.datasets[0].data = dadosOrdenados;
                    myChart.update();

                    proximaAtualizacaoSemana = setTimeout(() => atualizarGraficoSemana(dados, myChart), 2000);
                });
            } else {
                console.error('Nenhum dado encontrado ou erro na API');
                proximaAtualizacaoSemana = setTimeout(() => atualizarGraficoSemana(dados, myChart), 2000);
            }
        })
        .catch(function(error) {
            console.error(`Erro na atualização do gráfico semanal: ${error.message}`);
        });
    }

    // Gráfico Mensal
    let proximaAtualizacaoMes;

    function obterDadosGraficoMes() {
        let fkUsuario = sessionStorage.getItem("ID_USUARIO");

        if (proximaAtualizacaoMes != undefined) {
            clearTimeout(proximaAtualizacaoMes);
        }

        fetch(`/tarefas/mes/${fkUsuario}`, { cache: 'no-store' }).then(function(response) {
            if (response.ok) {
                response.json().then(function(resposta) {
                    console.log(`Dados recebidos mês: ${JSON.stringify(resposta)}`);
                    plotarGraficoMes(resposta);
                });
            } else {
                console.error('Nenhum dado encontrado ou erro na API');
            }
        })
        .catch(function(error) {
            console.error(`Erro na obtenção dos dados p/ gráfico mensal: ${error.message}`);
        });
    }

    function plotarGraficoMes(resposta) {
        console.log('iniciando plotagem do gráfico mensal...');

        let lista = Array.isArray(resposta) ? resposta : [];

        let labels = [];
        let valores = [];

        for (let i = 0; i < lista.length; i++) {
            labels.push(lista[i].mes);
            valores.push(lista[i].total);
        }

        let dados = {
            labels: labels,
            datasets: [{
                label: "Tarefas Concluídas",
                data: valores,
                backgroundColor: ["#DDD1FE", "#C5E3FF", "#D3EBC5", "#FCFD96"]
            }]
        };

        let config = {
            type: "bar",
            data: dados,
            options: {
                plugins: { legend: { display: false } }
            }
        };

        if (window.graficoMes && window.graficoMes.destroy) {
            window.graficoMes.destroy();
        }

        window.graficoMes = new Chart(document.getElementById("graficoMes"), config);

        setTimeout(() => atualizarGraficoMes(dados, window.graficoMes), 2000);
    }

    function atualizarGraficoMes(dados, myChart) {
        let fkUsuario = sessionStorage.getItem("ID_USUARIO");

        fetch(`/tarefas/mes/${fkUsuario}`, { cache: 'no-store' }).then(function(response) {
            if (response.ok) {
                response.json().then(function(novosDados) {
                    console.log(`Dados atualizados mês: ${JSON.stringify(novosDados)}`);

                    let lista = Array.isArray(novosDados) ? novosDados : [];

                    let labels = [];
                    let valores = [];

                    for (let i = 0; i < lista.length; i++) {
                        labels.push(lista[i].mes);
                        valores.push(lista[i].total);
                    }

                    dados.labels = labels;
                    dados.datasets[0].data = valores;
                    myChart.update();

                    proximaAtualizacaoMes = setTimeout(() => atualizarGraficoMes(dados, myChart), 2000);
                });
            } else {
                console.error('Nenhum dado encontrado ou erro na API');
                proximaAtualizacaoMes = setTimeout(() => atualizarGraficoMes(dados, myChart), 2000);
            }
        })
        .catch(function(error) {
            console.error(`Erro na atualização do gráfico mensal: ${error.message}`);
        });
    }
</script>
